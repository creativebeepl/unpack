; Limity przesyłania i czasu — dostosuj do swojego serwera.
upload_max_filesize = 256M
post_max_size = 260M
; Pakowanie wielu plików naraz: domyślne 20 plików i 1000 pól formularza to za mało
max_file_uploads = 1000
max_input_vars = 10000
max_execution_time = 300
max_input_time = 300
memory_limit = 256M
expose_php = Off
session.cookie_httponly = 1
session.use_strict_mode = 1
